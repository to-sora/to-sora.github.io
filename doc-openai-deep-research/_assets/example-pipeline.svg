<svg xmlns="http://www.w3.org/2000/svg" width="960" height="240" viewBox="0 0 960 240" role="img" aria-labelledby="title desc">
  <title id="title">Document publishing pipeline</title>
  <desc id="desc">Upload a document and sidecar metadata, the browser discovers the category, then the portfolio renders the document.</desc>
  <rect width="960" height="240" rx="24" fill="#f6f7f9"/>
  <g font-family="system-ui, sans-serif" fill="#111827" text-anchor="middle">
    <rect x="50" y="70" width="220" height="100" rx="16" fill="#ffffff" stroke="#c7cdd6"/>
    <text x="160" y="112" font-size="20" font-weight="700">Upload</text>
    <text x="160" y="142" font-size="15">document + .json</text>
    <rect x="370" y="70" width="220" height="100" rx="16" fill="#ffffff" stroke="#c7cdd6"/>
    <text x="480" y="112" font-size="20" font-weight="700">Discover</text>
    <text x="480" y="142" font-size="15">doc-* category</text>
    <rect x="690" y="70" width="220" height="100" rx="16" fill="#ffffff" stroke="#c7cdd6"/>
    <text x="800" y="112" font-size="20" font-weight="700">Read</text>
    <text x="800" y="142" font-size="15">Markdown + math</text>
    <text x="320" y="126" font-size="30">→</text>
    <text x="640" y="126" font-size="30">→</text>
  </g>
</svg>
