<title id="art-title">星夜 · 荒诞远征</title>
<desc id="art-desc">梵高星空风格的超现实画面。普通夜鹭骑着穿中世纪板甲的北极熊，在空中飞翔，背上载着一只骑黑色涂蜡、带铜绿的铜制自行车的鹈鹕；鹈鹕橘色的长嘴叼着一条大肥鱼。后方的秦始皇站在挂载霹雳12导弹的 F-14 机翼上，手持锯短的独头弹猎枪追逐。北极熊撞上悬浮的黄金椅子，奥特曼瘫坐其上。背景中超新星爆发，陨石击中地面的恐龙；恐龙头上的巨型竹节虫正在发射原子弹。</desc>
